    <text x="16" y="30" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="22">👔</text>
    <text x="16" y="56" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#FFF">Employer-Funded</text>
